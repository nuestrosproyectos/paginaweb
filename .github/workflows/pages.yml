name: Publicar web en GitHub Pages

on:
  push:
    branches: [claude/psicologia-xbc50y]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar archivos de la web (sin la carpeta de técnicos)
        run: |
          mkdir _site
          cp index.html aviso-legal.html privacidad.html .nojekyll _site/
          cp -r fotos _site/
          ls -R _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
